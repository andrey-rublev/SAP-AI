[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai"
version = "0.2.0"
description = "Offline learning experiments and a calibrated Super Auto Pets desktop controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
dqn = ["torch>=2.6,<3"]
plot = ["matplotlib>=3.8,<4"]
live = ["pyautogui>=0.9.54", "pytesseract>=0.3.10", "Pillow>=10,<13"]
dev = ["pytest>=8,<10", "Pillow>=10,<13"]

[project.scripts]
sap-train = "sap_ai.sim.main:cli"
sap-benchmark = "sap_ai.sim.benchmark:cli"
sap-play = "sap_ai.sim.play:cli"
sap-dqn = "sap_ai.sim.dqn:main"
sap-desktop = "sap_ai.desktop.cli:cli"

[tool.setuptools.packages.find]
include = ["sap_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
