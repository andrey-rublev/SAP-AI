[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai"
version = "0.2.0"
description = "Reproducible reinforcement-learning experiments in a SAP-inspired toy arena"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
dqn = ["torch>=2.6,<3"]
plot = ["matplotlib>=3.8,<4"]
live = ["pyautogui>=0.9.54", "pytesseract>=0.3.10", "Pillow>=10,<13"]
dev = ["pytest>=8,<10", "Pillow>=10,<13"]

[project.scripts]
sap-train = "main:cli"
sap-benchmark = "benchmark:cli"
sap-play = "play:cli"
sap-dqn = "dqn:main"
sap-desktop = "desktop:cli"

[tool.setuptools]
py-modules = ["agent", "autogui", "benchmark", "desktop", "desktop_runtime", "desktop_session", "desktop_state", "desktop_vision", "dqn", "evaluation", "game", "heuristic", "main", "metrics", "play", "train"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
